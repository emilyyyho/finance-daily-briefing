name: Deliver daily report to Feishu

on:
  push:
    branches: [master]
    paths:
      - "reports/**"
  workflow_dispatch:
    inputs:
      report_path:
        description: "Path to the Markdown report, for example reports/2026-09-13.md"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Find report path
        id: report
        shell: bash
        env:
          EVENT_NAME: \${{ github.event_name }}
          INPUT_REPORT_PATH: \${{ inputs.report_path }}
          SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            path="$INPUT_REPORT_PATH"
          else
            path="$(git diff-tree --no-commit-id --name-only -r "$SHA" | grep -E '^reports/.*\.md$' | head -n 1 || true)"
          fi
          if [ -z "$path" ]; then
            echo "No Markdown report changed in this event." >&2
            exit 1
          fi
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Send report to Feishu
        env:
          FEISHU_WEBHOOK_URL: \${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python gpt-scheduled-task/send_feishu.py "\${{ steps.report.outputs.path }}"
